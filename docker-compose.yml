services:
  postgres:
    image: postgres:16
    container_name: pokecard-postgres
    environment:
      POSTGRES_DB: pokecardstore
      POSTGRES_USER: pokecardstore_user
      POSTGRES_PASSWORD: pokecardstore_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: pokecard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: pokecard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devops
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: